name: AWS APP

on:
  push: 
    branches:
      - dev
  pull_request: 
   branches:
     - main

jobs:
  compilation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7  

      - name: node setup
        uses: actions/setup-node@v7
        with:
          node-version: 23

      - name: Front End compilation
        run: |
          cd ./client
          find . -name "*.js" -exec node --check {} + 
   
      - name: Back End compilation
        run: |
          cd ./api
          find . -name "*.js" -exec node --check {} +

      - name: Setup Gitleaks
        uses: gitleaks/gitleaks-action@v3

      - name: Run Gitleaks
        run: |
          gitleaks detect --source ./client --exit-code 1
          gitleaks detect --source ./api --exit-code 1

  trivy_files_scan:
    runs-on: ubuntu-latest
    needs: compilation
    steps:
     - name: Checkout
       uses: actions/checkout@v7  
    
     - name: Run Trivy vulnerability scanner in fs mode
       uses: aquasecurity/trivy-action@v0.36.0
       with:
        format: 'table'
        exit-code: '0'
        scan-type: 'fs'
        scan-ref: '.'
        ignore-unfixed: true
        vuln-type: 'os,library'
        severity: 'CRITICAL,HIGH'










          
