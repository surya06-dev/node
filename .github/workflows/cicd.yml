name: crud app

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - dev
      - main

permissions:
  contents: read

env:
  FRONTEND_IMAGE: ${{ vars.DOCKERHUB_USERNAME}}/${{ vars.FRONT_APP }}
  BACKEND_IMAGE: ${{ vars.DOCKERHUB_USERNAME}}/${{ vars.BACKEND_APP }}

jobs:

  # ==========================================================
  # 1. VALIDATE
  # ==========================================================

  validate_FE:
    name: Validate Application of Front End
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "23"

      - name: compilation
        run: |
           cd ./client
           find . -name "*.js" -exec node --check {} + 

      - name: Run lint
        run: |
          cd client
          npm run lint --if-present

  validate_BE:
    name: Validate Application of back End
    runs-on: ubuntu-latest
    needs: validate_FE

    permissions:
      contents: read
      pull-requests: write

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "23"

      - name: compilation
        run: |
           cd ./api
           find . -name "*.js" -exec node --check {} + 

      - name: Run lint
        run: |
          cd ./api
          npm run lint --if-present

  GitLeaks:
    runs-on: ubuntu-latest
    needs: validate_BE
    steps:
      # ------------------------------
      # Secret scanning
      # ------------------------------
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks Setup
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Gitleaks Scan
        run: |
          gitleaks detect --source ./client --exit-code 1
          gitleaks detect --source ./api --exit-code 1

      # ------------------------------
      # Filesystem vulnerability scan
      # ------------------------------
  Trivy_FS:
    runs-on: ubuntu-latest
    needs: GitLeaks
    steps:

      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: CRITICAL,HIGH
          exit-code: "0"
          format: table

  # Sonar_Analysis:  
  #   runs-on: ubuntu:latest
  #   steps:      
  #     # ------------------------------
  #     # SonarQube
  #     # ------------------------------
  #     - name: SonarQube scan
  #       uses: Sonarsource/sonarqube-scan-action@v3
        # env:
        #   SONAR_TOKEN:  ${{ secrets.SONAR_TOKEN }}
        #   SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

  # ==========================================================
  # 2. BUILD + SCAN + PUSH
  # ==========================================================

  docker:
    name: Build-Scan-Push Docker Image
    runs-on: ubuntu-latest
    needs:
      - Trivy_FS

    # Only push images after merge/push to main.
    # PRs only run validation.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read

    steps:

      # ------------------------------
      # Checkout
      # ------------------------------

      - name: Checkout source code
        uses: actions/checkout@v4


      # ------------------------------
      # Setup Docker Buildx
      # ------------------------------

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3


      # ------------------------------
      # Login to Docker Hub
      # ------------------------------

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ------------------------------
      # Generate image metadata
      # ------------------------------

      - name: Generate Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.FRONTEND_IMAGE }}

          tags: |
            type=sha,format=short,prefix=sha-
            type=raw,value=latest


      # ------------------------------
      # Build Docker image
      # ------------------------------

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./client
          load: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:sha-${{ github.sha }}

          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ------------------------------
      # Scan exact built image
      # ------------------------------

      - name: Trivy client container image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.FRONTEND_IMAGE }}:sha-${{ github.sha }}
          vuln-type: 'os,library'
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"
          format: table

      - name: Build Backtend image
        uses: docker/build-push-action@v6
        with:
          context: ./api
          load: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:sha-${{ github.sha }}

          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy api container image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.BACKEND_IMAGE }}:sha-${{ github.sha }}
          vuln-type: 'os,library'
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"
          format: table


      # ========================================================
      # PUSH FRONTEND
      # ========================================================

      - name: Push frontend image
        run: |
          docker push \
            ${{ env.FRONTEND_IMAGE }}:sha-${{ github.sha }}


      # ========================================================
      # PUSH BACKEND
      # ========================================================

      - name: Push backend image
        run: |
          docker push \
            ${{ env.BACKEND_IMAGE }}:sha-${{ github.sha }}

  update-dev-image:
    name: Update Dev Image Tags
    runs-on: ubuntu-latest
    needs:
      - docker
    steps:
      - name: Checkout GitOps repository
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.GITOPS_REPO }}
          token: ${{ secrets.GITOPS_TOKEN }}
          path: gitops

      - name: Update image tags
        working-directory: gitops
        run: |
          FILE="node-gitops/overlays/devkustomization.yaml"

          sed -i \
            "s|newTag: sha-.*|newTag: sha-${GITHUB_SHA}|g" \
            "$FILE"

      - name: Verify updated tags
        working-directory: gitops
        run: |
          echo "Updated kustomization.yaml:"
          cat node-gitops/overlays/devkustomization.yaml

      - name: Commit and push changes
        working-directory: gitops
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add node-gitops/overlays/devkustomization.yaml
          if git diff --cached --quiet; then
            echo "No image changes detected"
            exit 0
          fi

          git commit -m "chore(dev): update images to sha-${GITHUB_SHA}"

          git push

