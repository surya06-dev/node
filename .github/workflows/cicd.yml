name: AWS APP

on:
  push: 
    branches:
      - dev
  pull_request: 
   branches:
     - main

jobs:
  compilation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7  

      - name: node setup
        uses: actions/setup-node@v7
        with:
          node-version: 23

      - name: Front End compilation
        run: |
          cd ./client
          find . -name "*.js" -exec node --check {} + 
   
      - name: Back End compilation
        run: |
          cd ./api
          find . -name "*.js" -exec node --check {} +
          
           










          
